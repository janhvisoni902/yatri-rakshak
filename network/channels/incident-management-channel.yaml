---
Profiles:
  IncidentManagementChannel:
    Consortium: YatriRakshakConsortium
    <<: *ChannelDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *PoliceDept
        - *TourismDept
      Capabilities:
        <<: *ApplicationCapabilities

Organizations:
  - &PoliceDept
    Name: PoliceDeptMSP
    ID: PoliceDeptMSP
    MSPDir: ../organizations/peerOrganizations/police-dept.yatrirakshak.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('PoliceDeptMSP.admin', 'PoliceDeptMSP.peer', 'PoliceDeptMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('PoliceDeptMSP.admin', 'PoliceDeptMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('PoliceDeptMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('PoliceDeptMSP.peer')"
    AnchorPeers:
      - Host: peer0.police-dept.yatrirakshak.com
        Port: 9051

  - &TourismDept
    Name: TourismDeptMSP
    ID: TourismDeptMSP
    MSPDir: ../organizations/peerOrganizations/tourism-dept.yatrirakshak.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('TourismDeptMSP.admin', 'TourismDeptMSP.peer', 'TourismDeptMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('TourismDeptMSP.admin', 'TourismDeptMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('TourismDeptMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('TourismDeptMSP.peer')"
    AnchorPeers:
      - Host: peer0.tourism-dept.yatrirakshak.com
        Port: 7051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true

  Orderer: &OrdererCapabilities
    V2_0: true

  Application: &ApplicationCapabilities
    V2_0: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer.yatrirakshak.com:7050
  EtcdRaft:
    Consenters:
    - Host: orderer.yatrirakshak.com
      Port: 7050
      ClientTLSCert: ../organizations/ordererOrganizations/yatrirakshak.com/orderers/orderer.yatrirakshak.com/tls/server.crt
      ServerTLSCert: ../organizations/ordererOrganizations/yatrirakshak.com/orderers/orderer.yatrirakshak.com/tls/server.crt
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities